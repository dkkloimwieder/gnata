[package]
name = "gnata"
version = "0.1.0"
edition = "2024"
description = "JSONata 2.x query and transformation engine"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

# Parsing & Regex
regex = "1.12"

# JSON & Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }

# Error handling — hand-rolled JsonataError, no thiserror needed

# Numeric formatting
ryu-js = "1.0"

# Date/Time
jiff = "0.2"

# Encoding
base64 = "0.22"
percent-encoding = "2.3"



# RNG
fastrand = "2"


# Stack growth (mirrors Go's auto-growing goroutine stacks) — not available on WASM
# stacker is in [target.'cfg(not(target_arch = "wasm32"))'.dependencies]

# Profiling (optional)
dhat = { version = "0.3", optional = true }
simd-json = { version = "0.17.0", features = ["serde_impl"] }
halfbrown = "0.4.0"
compact_str = { version = "0.9.0", features = ["serde"] }
mimalloc = { version = "0.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stacker = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[features]
default = ["mimalloc-alloc"]
dhat-heap = ["dhat"]
mimalloc-alloc = ["mimalloc"]

[dev-dependencies]
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "gnata-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "gnata-dhat"
path = "src/bin/dhat_profile.rs"

[[bench]]
name = "eval"
harness = false

[[bench]]
name = "parse"
harness = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# Profiling: release speed with debug symbols
[profile.profiling]
inherits = "release"
debug = true
strip = false
