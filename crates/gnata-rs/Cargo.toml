[package]
name = "gnata"
version = "0.1.0"
edition = "2024"
# Floor derives from let-chains (stabilized 1.88); edition 2024 itself needs
# only 1.85. Older toolchains are not tested in CI.
rust-version = "1.88"
description = "JSONata 2.x query and transformation engine"
license = "MIT"
repository = "https://github.com/dkkloimwieder/gnata"
readme = "README.md"
keywords = ["jsonata", "json", "query", "transformation", "wasm"]
categories = ["parser-implementations", "wasm"]
# Only library sources ship to crates.io. The integration tests need
# testdata/ and the benches need bench/ data files, both at the repo root
# outside this package; bench sources are still included so the [[bench]]
# targets below remain valid.
include = [
    "src/**",
    "benches/**",
    "examples/**",
    "README.md",
    "LICENSE",
]

[lib]
crate-type = ["cdylib", "rlib"]
# Keep `cargo bench` off the libtest harness — criterion benches only.
bench = false

[dependencies]
# Regex backend — enable exactly one. The default `regex` feature uses the
# full crate (Unicode-complete, RE2 semantics, same model as Go's regexp).
# The `regex-lite` feature shrinks WASM builds by ~250 KB.
regex = { version = "1.12", optional = true }
regex-lite = { version = "0.1", optional = true }

# JSON parsing & serialization. simd-json parses input documents; serde_json
# provides arbitrary-precision numbers and ordered maps for output.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
simd-json = { version = "0.17.0", features = ["serde_impl"] }

# Value internals: insertion-ordered object maps (behavioral invariant #8)
# and inline small strings for keys and string values.
indexmap = "2"
compact_str = { version = "0.9.0", features = ["serde"] }

# Exact ECMAScript Number.toString() formatting (behavioral invariant #9).
ryu-js = "1.0"

# Encoding builtins: $base64encode/$base64decode, $encodeUrl/$decodeUrl.
base64 = "0.22"
percent-encoding = "2.3"

# Non-crypto RNG for $random and $shuffle.
fastrand = "2"

# Heap profiling for the gnata-dhat bin only (feature: dhat-heap).
dhat = { version = "0.3", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Segmented stack growth at recursion entry points (mirrors Go's growable
# goroutine stacks). WASM cannot grow its stack, so it is excluded there.
stacker = "0.1"
mimalloc = { version = "0.1", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[features]
default = ["mimalloc-alloc", "regex"]
# Full Unicode regex backend (recommended).
regex = ["dep:regex"]
# Lighter regex backend for smaller WASM builds.
regex-lite = ["dep:regex-lite"]
# mimalloc as the global allocator on native targets.
mimalloc-alloc = ["mimalloc"]
# Heap profiling instrumentation for the gnata-dhat bin.
dhat-heap = ["dhat"]
# Build the gnata-bench CLI (repo benchmarking tool, not part of the library).
bench-bin = []

[dev-dependencies]
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.11.0"

# Repo tooling bins, gated behind features so `cargo install gnata` and
# `cargo publish --dry-run` never build them.
[[bin]]
name = "gnata-bench"
path = "src/bin/bench.rs"
required-features = ["bench-bin"]

[[bin]]
name = "gnata-dhat"
path = "src/bin/dhat_profile.rs"
required-features = ["dhat-heap"]

[[bench]]
name = "eval"
harness = false

[[bench]]
name = "parse"
harness = false

# Native release/bench builds optimize for speed. The WASM build does not
# use this: scripts/build-wasm.sh sets its own opt-level and runs wasm-opt.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Profiling: release speed with debug symbols
[profile.profiling]
inherits = "release"
debug = true
strip = false
