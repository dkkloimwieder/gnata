[package]
name = "gnata"
version = "0.1.0"
edition = "2024"
description = "JSONata 2.x query and transformation engine"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
# Keep `cargo bench` off the libtest harness — criterion benches only.
bench = false

[dependencies]

# Parsing & Regex — default uses full `regex` crate with Unicode support.
# Enable `regex-lite` feature for smaller WASM builds (~250KB savings).
regex = { version = "1.12", optional = true }
regex-lite = { version = "0.1", optional = true }

# JSON & Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }

# Error handling — hand-rolled JsonataError, no thiserror needed

# Numeric formatting
ryu-js = "1.0"


# Encoding
base64 = "0.22"
percent-encoding = "2.3"



# RNG
fastrand = "2"


# Stack growth (mirrors Go's auto-growing goroutine stacks) — not available on WASM
# stacker is in [target.'cfg(not(target_arch = "wasm32"))'.dependencies]

# Profiling (optional)
dhat = { version = "0.3", optional = true }
simd-json = { version = "0.17.0", features = ["serde_impl"] }
indexmap = "2"
compact_str = { version = "0.9.0", features = ["serde"] }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stacker = "0.1"
mimalloc = { version = "0.1", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[features]
default = ["mimalloc-alloc", "regex"]
regex-lite = ["dep:regex-lite"]
regex = ["dep:regex"]
dhat-heap = ["dhat"]
mimalloc-alloc = ["mimalloc"]

[dev-dependencies]
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.11.0"

[[bin]]
name = "gnata-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "gnata-dhat"
path = "src/bin/dhat_profile.rs"

[[bench]]
name = "eval"
harness = false

[[bench]]
name = "parse"
harness = false

# Native release/bench builds optimize for speed. The WASM build does not
# use this: scripts/build-wasm.sh sets its own opt-level and runs wasm-opt.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Profiling: release speed with debug symbols
[profile.profiling]
inherits = "release"
debug = true
strip = false
